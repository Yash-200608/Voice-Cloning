[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceclone"
version = "0.3.0"
description = "Persistent Artificial Voice Identity Engine"
requires-python = ">=3.10,<3.13"
dependencies = [
    "chatterbox-tts>=0.1.1",
    "resemblyzer>=0.1.4",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "numpy>=1.24,<2.0",
    "scipy>=1.11",
    "noisereduce>=3.0.0",
    "pyloudnorm>=0.1.1",
    "ffmpeg-python>=0.2.0",
    "psutil>=5.9",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
include = ["voiceclone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Chatterbox/Resemblyzer model weights",
]
